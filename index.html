<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронювання туру</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 380px; 
            margin: 20px auto; 
            padding: 10px; 
        }
        img { 
            width: 100%; 
            border-radius: 6px; 
            display: block;
        }
        input, button { 
            width: 100%; 
            padding: 10px; 
            margin: 6px 0; 
            box-sizing: border-box; 
            border-radius: 4px; 
            border: 1px solid #ccc; 
        }
        button { 
            background: #28a745; 
            color: white; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
        }
        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>

    <h3>Ваш тур</h3>
    <!-- Зображення туру -->
    <img src="https://via.placeholder.com/380x200?text=%D0%A2%D1%83%D1%80" alt="Фото туру">

    <!-- Форма бронювання -->
    <form action="https://formspree.io/f/xzeeeerg" method="POST">
        <label>Ім'я:</label>
        <input type="text" name="ПІБ" required placeholder="Введіть ваше ім'я">

        <label>Телефон:</label>
        <input type="tel" name="Телефон" required placeholder="+380...">

        <label>Кількість квитків (макс. 10):</label>
        <input type="number" name="Квитків" min="1" max="10" value="1" required>

        <button type="submit">Забронювати</button>
    </form>

</body>
</html>
